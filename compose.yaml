services:
  postgres:
    image: postgres:17-alpine
    container_name: imob-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imobpro}
      POSTGRES_USER: ${POSTGRES_USER:-imobpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imobpro_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - imobpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imobpro} -d ${POSTGRES_DB:-imobpro}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: imob-pro-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-redis-password}
    volumes:
      - imobpro_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    container_name: imob-pro-kotlin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-imobpro}
      DB_USERNAME: ${POSTGRES_USER:-imobpro}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-imobpro_dev}
      SERVER_PORT: 8080
      IMOBPRO_STORAGE_ROOT: /var/lib/imobpro/uploads
      IMOBPRO_STORAGE_S3_ENABLED: ${IMOBPRO_STORAGE_S3_ENABLED:-false}
      IMOBPRO_STORAGE_S3_BUCKET: ${IMOBPRO_STORAGE_S3_BUCKET:-}
      IMOBPRO_STORAGE_S3_REGION: ${IMOBPRO_STORAGE_S3_REGION:-us-east-1}
      IMOBPRO_STORAGE_S3_ENDPOINT: ${IMOBPRO_STORAGE_S3_ENDPOINT:-}
      IMOBPRO_STORAGE_S3_PATH_STYLE: ${IMOBPRO_STORAGE_S3_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:3100}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USER:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASS:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - imobpro_uploads:/var/lib/imobpro/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
  legacy-web:
    build:
      context: ./web
    container_name: imob-pro-legacy-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
  compat-bff:
    build:
      context: ./compat-bff
    container_name: imob-pro-compat-bff
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      legacy-web:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3100
      DATABASE_URL: postgres://${POSTGRES_USER:-imobpro}:${POSTGRES_PASSWORD:-imobpro_dev}@postgres:5432/${POSTGRES_DB:-imobpro}
      KOTLIN_API_URL: http://api:8080
      REDIS_URL: redis://:${REDIS_PASSWORD:-development-only-redis-password}@redis:6379
      SESSION_SECRET: ${BFF_SESSION_SECRET:-development-only-change-this-session-secret-32}
      PUBLIC_ORGANIZATION_SLUG: ${PUBLIC_ORGANIZATION_SLUG:-}
      LEGACY_WEB_URL: ${LEGACY_WEB_URL:-http://legacy-web:80}
      TRUST_PROXY: ${BFF_TRUST_PROXY:-false}
    ports:
      - "${BFF_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  imobpro_postgres_data:
  imobpro_uploads:
  imobpro_redis_data:
