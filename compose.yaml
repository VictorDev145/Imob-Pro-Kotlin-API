services:
  postgres:
    image: postgres:17-alpine
    container_name: imob-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imobpro
      POSTGRES_USER: imobpro
      POSTGRES_PASSWORD: imobpro_dev
    ports:
      - "5432:5432"
    volumes:
      - imobpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imobpro -d imobpro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  imobpro_postgres_data:
