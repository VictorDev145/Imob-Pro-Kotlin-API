spring:
  application:
    name: imob-pro-kotlin-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/imobpro}
    username: ${DB_USERNAME:imobpro}
    password: ${DB_PASSWORD:imobpro_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 210MB
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    org.hibernate.SQL: INFO
imobpro:
  storage:
    local:
      root: ${IMOBPRO_STORAGE_ROOT:./var/imobpro/uploads}
    s3:
      enabled: ${IMOBPRO_STORAGE_S3_ENABLED:false}
      bucket: ${IMOBPRO_STORAGE_S3_BUCKET:}
      region: ${IMOBPRO_STORAGE_S3_REGION:us-east-1}
      endpoint: ${IMOBPRO_STORAGE_S3_ENDPOINT:}
      path-style: ${IMOBPRO_STORAGE_S3_PATH_STYLE:true}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
