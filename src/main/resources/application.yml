spring:
  application:
    name: imob-pro-kotlin-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/imobpro}
    username: ${DB_USERNAME:imobpro}
    password: ${DB_PASSWORD:imobpro_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    org.hibernate.SQL: INFO
